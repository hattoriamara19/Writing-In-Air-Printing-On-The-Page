<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Air Pen Writing</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <div class="app">

        <header>

            <h1>🖊️ Air Pen Writing</h1>

            <p>Phase 2: Pen Tip Detection</p>

        </header>


        <div class="status" id="status">

            Camera is not started

        </div>


        <!-- Camera -->

        <div class="camera-container">

            <video
                id="camera"
                autoplay
                playsinline>
            </video>


            <!-- Detection dot -->

            <div
                id="detectedDot"
                class="detected-dot">
            </div>


            <div
                id="cameraMessage"
                class="camera-message">

                Press Start Camera

            </div>

        </div>


        <!-- Hidden processing canvas -->

        <canvas
            id="processingCanvas"
            class="hidden">
        </canvas>


        <!-- Drawing area -->

        <section class="drawing-section">

            <h2>Your Air Writing</h2>

            <div class="drawing-container">

                <canvas
                    id="drawingCanvas">
                </canvas>

            </div>

        </section>


        <!-- Controls -->

        <section class="controls">

            <button
                id="startCameraBtn"
                class="primary">

                📷 Start Camera

            </button>


            <button
                id="stopCameraBtn"
                class="danger"
                disabled>

                ⏹ Stop Camera

            </button>


            <button
                id="clearBtn">

                🗑 Clear

            </button>


            <button
                id="saveBtn"
                class="success">

                💾 Save Image

            </button>

        </section>


        <section class="info">

            <h3>Current Phase</h3>

            <p>

                🟢 The application is now searching for a
                bright green marker near your pen tip.

            </p>

            <p>

                Keep the pen marker clearly visible
                to the camera.

            </p>

        </section>


        <footer>

            Air Pen Writing • Phase 2

        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
